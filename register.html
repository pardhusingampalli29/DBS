<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - EventEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <div id="navbar"></div>
  <main class="container">
    <div id="msg"></div>
    <div class="card form-card">
      <h1>Create account</h1>
      <p class="sub">Register once, then sign up for any event.</p>
      <form id="registerForm">
        <label for="name">Full name</label>
        <input id="name" type="text" required maxlength="100">
        <label for="email">Email</label>
        <input id="email" type="email" required maxlength="100">
        <label for="phone">Phone (10 digits)</label>
        <input id="phone" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="9876543210">
        <label for="password">Password (at least 6 characters)</label>
        <input id="password" type="password" required minlength="6">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" required minlength="6">
        <button class="btn" type="submit">Create account</button>
      </form>
      <p style="margin-top:14px">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
