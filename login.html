<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EventEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div id="navbar"></div>
  <main class="container">
    <div id="msg"></div>
    <div class="card form-card">
      <h1>Login</h1>
      <p class="sub">Welcome back to EventEase.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Your password">
        <button class="btn" type="submit">Login</button>
      </form>
      <p style="margin-top:14px">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
